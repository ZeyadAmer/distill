name: Hotstash

options:
  bundleIdPrefix: com.zeyadamer
  deploymentTarget:
    macOS: "13.0"
    iOS: "16.0"
  createIntermediateGroups: true
  xcodeVersion: "16.0"
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "5.9"
    MACOSX_DEPLOYMENT_TARGET: "13.0"
    ENABLE_HARDENED_RUNTIME: YES

targets:
  Hotstash:
    type: application
    platform: macOS
    deploymentTarget: "13.0"

    sources:
      - path: Hotstash
        excludes:
          - Resources/Info.plist
          - Resources/Hotstash.entitlements

    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.zeyadamer.hotstash
        PRODUCT_NAME: Hotstash
        SWIFT_VERSION: "5.9"
        MACOSX_DEPLOYMENT_TARGET: "13.0"
        INFOPLIST_FILE: Hotstash/Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: Hotstash/Resources/Hotstash.entitlements
        DEVELOPMENT_TEAM: 4PMSUCCX7P
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_APP_SANDBOX: YES
        ENABLE_HARDENED_RUNTIME: YES
        CODE_SIGN_STYLE: Automatic
        SWIFT_STRICT_CONCURRENCY: minimal
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/../Frameworks"
        COMBINE_HIDPI_IMAGES: YES
        ALWAYS_EMBED_SWIFT_STANDARD_LIBRARIES: YES
      configs:
        Debug:
          SWIFT_OPTIMIZATION_LEVEL: "-Onone"
          DEBUG_INFORMATION_FORMAT: dwarf
          ONLY_ACTIVE_ARCH: YES
        Release:
          SWIFT_OPTIMIZATION_LEVEL: "-O"
          DEBUG_INFORMATION_FORMAT: "dwarf-with-dsym"
          VALIDATE_PRODUCT: YES
          ONLY_ACTIVE_ARCH: NO

    dependencies:
      - sdk: AppKit.framework
      - sdk: Foundation.framework
      - sdk: Carbon.framework
      - sdk: ServiceManagement.framework
      - sdk: StoreKit.framework
      - sdk: CoreGraphics.framework

    entitlements:
      path: Hotstash/Resources/Hotstash.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.automation.apple-events: true

  HotstashIOS:
    type: application
    platform: iOS
    deploymentTarget: "16.0"

    sources:
      - path: HotstashIOS
        excludes:
          - Resources/Info.plist
          - Resources/HotstashIOS.entitlements
      - path: Hotstash/Transforms
      - path: Hotstash/App/Notifications.swift
      - path: Hotstash/Monetization/PurchaseManager.swift
      - path: Hotstash/Monetization/TrialManager.swift
      - path: HotstashControls/Intents/SaveClipboardIntent.swift
      - path: HotstashControls/Intents/OpenHistoryIntent.swift

    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.zeyadamer.hotstash
        PRODUCT_NAME: Hotstash
        SWIFT_VERSION: "5.9"
        IPHONEOS_DEPLOYMENT_TARGET: "16.0"
        INFOPLIST_FILE: HotstashIOS/Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: HotstashIOS/Resources/HotstashIOS.entitlements
        DEVELOPMENT_TEAM: 4PMSUCCX7P
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_STYLE: Automatic
        SWIFT_STRICT_CONCURRENCY: minimal
        ALWAYS_EMBED_SWIFT_STANDARD_LIBRARIES: YES
        TARGETED_DEVICE_FAMILY: "1,2"
      configs:
        Debug:
          SWIFT_OPTIMIZATION_LEVEL: "-Onone"
          DEBUG_INFORMATION_FORMAT: dwarf
          ONLY_ACTIVE_ARCH: YES
        Release:
          SWIFT_OPTIMIZATION_LEVEL: "-O"
          DEBUG_INFORMATION_FORMAT: "dwarf-with-dsym"
          VALIDATE_PRODUCT: YES
          ONLY_ACTIVE_ARCH: NO

    dependencies:
      - sdk: UIKit.framework
      - sdk: Foundation.framework
      - sdk: StoreKit.framework
      - target: HotstashShare
        embed: true
      - target: HotstashControls
        embed: true

    entitlements:
      path: HotstashIOS/Resources/HotstashIOS.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.zeyadamer.hotstash

  HotstashShare:
    type: app-extension
    platform: iOS
    deploymentTarget: "16.0"

    sources:
      - path: HotstashShare
        excludes:
          - Resources/Info.plist
          - Resources/HotstashShare.entitlements
      - path: Hotstash/Transforms
      - path: HotstashIOS/Models/ClipboardItem.swift
      - path: HotstashIOS/Models/SharedDefaults.swift

    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.zeyadamer.hotstash.share
        PRODUCT_NAME: HotstashShare
        SWIFT_VERSION: "5.9"
        IPHONEOS_DEPLOYMENT_TARGET: "16.0"
        INFOPLIST_FILE: HotstashShare/Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: HotstashShare/Resources/HotstashShare.entitlements
        DEVELOPMENT_TEAM: 4PMSUCCX7P
        CODE_SIGN_STYLE: Automatic
        SWIFT_STRICT_CONCURRENCY: minimal
      configs:
        Debug:
          SWIFT_OPTIMIZATION_LEVEL: "-Onone"
          DEBUG_INFORMATION_FORMAT: dwarf
          ONLY_ACTIVE_ARCH: YES
        Release:
          SWIFT_OPTIMIZATION_LEVEL: "-O"
          DEBUG_INFORMATION_FORMAT: "dwarf-with-dsym"
          VALIDATE_PRODUCT: YES
          ONLY_ACTIVE_ARCH: NO

    entitlements:
      path: HotstashShare/Resources/HotstashShare.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.zeyadamer.hotstash

  HotstashControls:
    type: app-extension
    platform: iOS
    deploymentTarget: "18.0"

    sources:
      - path: HotstashControls
        excludes:
          - Resources/Info.plist
          - Resources/HotstashControls.entitlements
      - path: Hotstash/Transforms
      - path: HotstashIOS/Models/ClipboardItem.swift
      - path: HotstashIOS/Models/SharedDefaults.swift

    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.zeyadamer.hotstash.controls
        PRODUCT_NAME: HotstashControls
        SWIFT_VERSION: "5.9"
        IPHONEOS_DEPLOYMENT_TARGET: "18.0"
        INFOPLIST_FILE: HotstashControls/Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: HotstashControls/Resources/HotstashControls.entitlements
        DEVELOPMENT_TEAM: 4PMSUCCX7P
        CODE_SIGN_STYLE: Automatic
        SWIFT_STRICT_CONCURRENCY: minimal
      configs:
        Debug:
          SWIFT_OPTIMIZATION_LEVEL: "-Onone"
          DEBUG_INFORMATION_FORMAT: dwarf
          ONLY_ACTIVE_ARCH: YES
        Release:
          SWIFT_OPTIMIZATION_LEVEL: "-O"
          DEBUG_INFORMATION_FORMAT: "dwarf-with-dsym"
          VALIDATE_PRODUCT: YES
          ONLY_ACTIVE_ARCH: NO

    dependencies:
      - sdk: WidgetKit.framework
      - sdk: SwiftUI.framework

    entitlements:
      path: HotstashControls/Resources/HotstashControls.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.zeyadamer.hotstash

schemes:
  Hotstash:
    build:
      targets:
        Hotstash: all
    run:
      config: Debug
    archive:
      config: Release
  HotstashIOS:
    build:
      targets:
        HotstashIOS: all
        HotstashShare: all
        HotstashControls: all
    run:
      config: Debug
    archive:
      config: Release
  HotstashControls-History:
    build:
      targets:
        HotstashControls: all
    run:
      config: Debug
      environmentVariables:
        _XCWidgetKind: com.zeyadamer.hotstash.control.history
    archive:
      config: Release
