name: Hotstash

options:
  bundleIdPrefix: com.zeyadamer
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
  xcodeVersion: "16.0"
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "5.9"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    ENABLE_HARDENED_RUNTIME: YES

targets:
  Hotstash:
    type: application
    platform: macOS
    deploymentTarget: "14.0"

    sources:
      - path: Hotstash
        excludes:
          - Resources/Info.plist
          - Resources/Hotstash.entitlements

    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.zeyadamer.hotstash
        PRODUCT_NAME: Hotstash
        SWIFT_VERSION: "5.9"
        MACOSX_DEPLOYMENT_TARGET: "14.0"
        INFOPLIST_FILE: Hotstash/Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: Hotstash/Resources/Hotstash.entitlements
        DEVELOPMENT_TEAM: 4PMSUCCX7P
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_APP_SANDBOX: YES
        ENABLE_HARDENED_RUNTIME: YES
        CODE_SIGN_STYLE: Automatic
        SWIFT_STRICT_CONCURRENCY: minimal
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/../Frameworks"
        COMBINE_HIDPI_IMAGES: YES
        ALWAYS_EMBED_SWIFT_STANDARD_LIBRARIES: YES
      configs:
        Debug:
          SWIFT_OPTIMIZATION_LEVEL: "-Onone"
          DEBUG_INFORMATION_FORMAT: dwarf
          ONLY_ACTIVE_ARCH: YES
          ENABLE_TESTABILITY: YES
        Release:
          SWIFT_OPTIMIZATION_LEVEL: "-O"
          DEBUG_INFORMATION_FORMAT: "dwarf-with-dsym"
          VALIDATE_PRODUCT: YES
          ONLY_ACTIVE_ARCH: NO

    dependencies:
      - sdk: AppKit.framework
      - sdk: Foundation.framework
      - sdk: Carbon.framework
      - sdk: ServiceManagement.framework
      - sdk: StoreKit.framework
      - sdk: CoreGraphics.framework

    entitlements:
      path: Hotstash/Resources/Hotstash.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.automation.apple-events: true
        com.apple.security.network.client: true
        com.apple.developer.icloud-container-identifiers:
          - iCloud.com.zeyadamer.hotstash
        com.apple.developer.icloud-services:
          - CloudKit
        com.apple.developer.ubiquity-kvstore-identifier: $(TeamIdentifierPrefix)com.zeyadamer.hotstash

  HotstashTests:
    type: bundle.unit-test
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: HotstashTests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.zeyadamer.hotstash.tests
        SWIFT_VERSION: "5.9"
        MACOSX_DEPLOYMENT_TARGET: "14.0"
        DEVELOPMENT_TEAM: 4PMSUCCX7P
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: Hotstash

schemes:
  Hotstash:
    build:
      targets:
        Hotstash: all
        HotstashTests: [test]
    test:
      targets:
        - HotstashTests
    run:
      config: Debug
    archive:
      config: Release
