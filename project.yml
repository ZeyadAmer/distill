name: Hotstash

options:
  bundleIdPrefix: com.zeyadamer
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
  xcodeVersion: "16.0"
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "5.9"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    ENABLE_HARDENED_RUNTIME: YES

targets:
  Hotstash:
    type: application
    platform: macOS
    deploymentTarget: "14.0"

    sources:
      - path: Hotstash
        excludes:
          - Resources/Info.plist
          - Resources/Hotstash.entitlements

    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.zeyadamer.hotstash
        PRODUCT_NAME: Hotstash
        SWIFT_VERSION: "5.9"
        MACOSX_DEPLOYMENT_TARGET: "14.0"
        INFOPLIST_FILE: Hotstash/Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: Hotstash/Resources/Hotstash.entitlements
        DEVELOPMENT_TEAM: 4PMSUCCX7P
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_APP_SANDBOX: YES
        ENABLE_HARDENED_RUNTIME: YES
        CODE_SIGN_STYLE: Automatic
        SWIFT_STRICT_CONCURRENCY: minimal
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/../Frameworks"
        COMBINE_HIDPI_IMAGES: YES
        ALWAYS_EMBED_SWIFT_STANDARD_LIBRARIES: YES
        SWIFT_OBJC_BRIDGING_HEADER: Hotstash/Transforms/Marketplace/HotstashJSCore.h
      configs:
        Debug:
          SWIFT_OPTIMIZATION_LEVEL: "-Onone"
          DEBUG_INFORMATION_FORMAT: dwarf
          ONLY_ACTIVE_ARCH: YES
          ENABLE_TESTABILITY: YES
        Release:
          SWIFT_OPTIMIZATION_LEVEL: "-O"
          DEBUG_INFORMATION_FORMAT: "dwarf-with-dsym"
          VALIDATE_PRODUCT: YES
          ONLY_ACTIVE_ARCH: NO

    dependencies:
      - sdk: AppKit.framework
      - sdk: Foundation.framework
      - sdk: Carbon.framework
      - sdk: ServiceManagement.framework
      - sdk: StoreKit.framework
      - sdk: CoreGraphics.framework
      - sdk: JavaScriptCore.framework
      - sdk: AuthenticationServices.framework

    entitlements:
      path: Hotstash/Resources/Hotstash.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.automation.apple-events: true
        com.apple.security.network.client: true
        com.apple.security.files.user-selected.read-only: true
        com.apple.security.files.bookmarks.app-scope: true
        com.apple.security.application-groups:
          - group.com.zeyadamer.hotstash
        com.apple.developer.icloud-container-identifiers:
          - iCloud.com.zeyadamer.hotstash
        com.apple.developer.icloud-services:
          - CloudKit
        com.apple.developer.applesignin:
          - Default

  HotstashTests:
    type: bundle.unit-test
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: HotstashTests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.zeyadamer.hotstash.tests
        SWIFT_VERSION: "5.9"
        MACOSX_DEPLOYMENT_TARGET: "14.0"
        DEVELOPMENT_TEAM: 4PMSUCCX7P
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: Hotstash

  # ---------------------------------------------------------------------------
  # iOS targets (owned by the iOS track — do not fold into the Mac sections)
  # ---------------------------------------------------------------------------

  HotstashIOS:
    type: application
    platform: iOS
    deploymentTarget: "17.0"

    sources:
      - path: HotstashIOS
        excludes:
          - Resources/Info.plist
          - Resources/HotstashiOS.entitlements
      # Shared model + detector (FINAL files, shared with the Mac app)
      - path: Hotstash/Clipboard/ClipboardItem.swift
      - path: Hotstash/Transforms/ContentDetector.swift
      # SwiftData schema parity with the Mac container (ClipboardItem + StoredTransform)
      - path: Hotstash/Transforms/Marketplace/StoredTransform.swift
      - path: Hotstash/Transforms/Marketplace/TransformManifest.swift
      - path: Hotstash/Transforms/Marketplace/TransformManifestCodec.swift
      # Built-in text transforms (platform-clean, macOS-only ones are #if-guarded out)
      - path: Hotstash/Transforms/Transform.swift
      - path: Hotstash/Transforms/Transforms/CaseTransforms.swift
      - path: Hotstash/Transforms/Transforms/WhitespaceTransforms.swift
      - path: Hotstash/Transforms/Transforms/ListTransforms.swift
      - path: Hotstash/Transforms/Transforms/JSONTransforms.swift
      - path: Hotstash/Transforms/Transforms/EncodingTransforms.swift
      - path: Hotstash/Transforms/Transforms/CleanupTransforms.swift
      # Universal purchase: same StoreKit 2 manager + product id as the Mac app
      - path: Hotstash/Monetization/PurchaseManager.swift
      - path: Hotstash/Monetization/TrialManager.swift
      - path: Hotstash/App/Notifications.swift
      # Marketplace: data layer + view model are pure Foundation/SwiftData/JSCore
      - path: Hotstash/Transforms/Marketplace/MarketplaceLibrary.swift
      - path: Hotstash/Transforms/Marketplace/MarketplaceTransform.swift
      - path: Hotstash/Transforms/Marketplace/TextTransformEngine.swift
      - path: Hotstash/Transforms/Marketplace/TransformBodyHash.swift
      - path: Hotstash/Transforms/Marketplace/Networking
      - path: Hotstash/UI/Marketplace/MarketplaceViewModel.swift
      - path: Hotstash/Resources/Supabase.plist
        buildPhase: resources
      # App Intents referenced by HotstashShortcuts and the Control Center widgets
      - path: HotstashControls/Intents/SaveClipboardIntent.swift
      - path: HotstashControls/Intents/OpenHistoryIntent.swift

    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.zeyadamer.hotstash
        PRODUCT_NAME: Hotstash
        SWIFT_VERSION: "5.9"
        IPHONEOS_DEPLOYMENT_TARGET: "17.0"
        INFOPLIST_FILE: HotstashIOS/Resources/Info.plist
        DEVELOPMENT_TEAM: 4PMSUCCX7P
        CODE_SIGN_STYLE: Automatic
        SWIFT_STRICT_CONCURRENCY: minimal
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ALWAYS_EMBED_SWIFT_STANDARD_LIBRARIES: YES
        SWIFT_OBJC_BRIDGING_HEADER: Hotstash/Transforms/Marketplace/HotstashJSCore.h
      configs:
        Debug:
          SWIFT_OPTIMIZATION_LEVEL: "-Onone"
          DEBUG_INFORMATION_FORMAT: dwarf
          ONLY_ACTIVE_ARCH: YES
        Release:
          SWIFT_OPTIMIZATION_LEVEL: "-O"
          DEBUG_INFORMATION_FORMAT: "dwarf-with-dsym"
          VALIDATE_PRODUCT: YES
          ONLY_ACTIVE_ARCH: NO

    dependencies:
      - sdk: UIKit.framework
      - sdk: Foundation.framework
      - sdk: StoreKit.framework
      - target: HotstashKeyboard
        embed: true
      - target: HotstashShare
        embed: true
      - target: HotstashControls
        embed: true

    entitlements:
      path: HotstashIOS/Resources/HotstashiOS.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.zeyadamer.hotstash
        com.apple.developer.icloud-container-identifiers:
          - iCloud.com.zeyadamer.hotstash
        com.apple.developer.icloud-services:
          - CloudKit
        # Silent CloudKit pushes wake the app so Mac→iPhone sync lands
        # without the user opening the app.
        aps-environment: development

  HotstashKeyboard:
    type: app-extension
    platform: iOS
    deploymentTarget: "17.0"

    sources:
      - path: HotstashKeyboard
        excludes:
          - Resources/Info.plist
          - Resources/HotstashKeyboard.entitlements
      # Keyboard reads only the UserDefaults mirror — never the SwiftData store
      - path: HotstashIOS/Models/SharedDefaults.swift
      - path: HotstashIOS/Models/KeyboardClips.swift
      # Built-in transforms so clips can be inserted transformed
      - path: HotstashIOS/Models/IOSTransforms.swift
      - path: Hotstash/Transforms/ContentDetector.swift
      - path: Hotstash/Transforms/Transform.swift
      - path: Hotstash/Transforms/Transforms/CaseTransforms.swift
      - path: Hotstash/Transforms/Transforms/WhitespaceTransforms.swift
      - path: Hotstash/Transforms/Transforms/ListTransforms.swift
      - path: Hotstash/Transforms/Transforms/JSONTransforms.swift
      - path: Hotstash/Transforms/Transforms/EncodingTransforms.swift
      - path: Hotstash/Transforms/Transforms/CleanupTransforms.swift

    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.zeyadamer.hotstash.keyboard
        PRODUCT_NAME: HotstashKeyboard
        SWIFT_VERSION: "5.9"
        IPHONEOS_DEPLOYMENT_TARGET: "17.0"
        INFOPLIST_FILE: HotstashKeyboard/Resources/Info.plist
        DEVELOPMENT_TEAM: 4PMSUCCX7P
        CODE_SIGN_STYLE: Automatic
        SWIFT_STRICT_CONCURRENCY: minimal
        TARGETED_DEVICE_FAMILY: "1,2"
      configs:
        Debug:
          SWIFT_OPTIMIZATION_LEVEL: "-Onone"
          DEBUG_INFORMATION_FORMAT: dwarf
          ONLY_ACTIVE_ARCH: YES
        Release:
          SWIFT_OPTIMIZATION_LEVEL: "-O"
          DEBUG_INFORMATION_FORMAT: "dwarf-with-dsym"
          VALIDATE_PRODUCT: YES
          ONLY_ACTIVE_ARCH: NO

    entitlements:
      path: HotstashKeyboard/Resources/HotstashKeyboard.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.zeyadamer.hotstash

  HotstashShare:
    type: app-extension
    platform: iOS
    deploymentTarget: "17.0"

    sources:
      - path: HotstashShare
        excludes:
          - Resources/Info.plist
          - Resources/HotstashShare.entitlements
      # Shared model + store access (writes land in the app-group store)
      - path: Hotstash/Clipboard/ClipboardItem.swift
      - path: Hotstash/Transforms/ContentDetector.swift
      - path: Hotstash/Transforms/Marketplace/StoredTransform.swift
      - path: Hotstash/Transforms/Marketplace/TransformManifest.swift
      - path: Hotstash/Transforms/Marketplace/TransformManifestCodec.swift
      - path: Hotstash/Transforms/Transform.swift
      - path: Hotstash/Transforms/Transforms/CaseTransforms.swift
      - path: Hotstash/Transforms/Transforms/WhitespaceTransforms.swift
      - path: Hotstash/Transforms/Transforms/ListTransforms.swift
      - path: Hotstash/Transforms/Transforms/JSONTransforms.swift
      - path: Hotstash/Transforms/Transforms/EncodingTransforms.swift
      - path: Hotstash/Transforms/Transforms/CleanupTransforms.swift
      - path: HotstashIOS/Models/SharedDefaults.swift
      - path: HotstashIOS/Models/KeyboardClips.swift
      - path: HotstashIOS/Models/ModelContainer+iOS.swift
      - path: HotstashIOS/Models/IOSTransforms.swift

    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.zeyadamer.hotstash.share
        PRODUCT_NAME: HotstashShare
        SWIFT_VERSION: "5.9"
        IPHONEOS_DEPLOYMENT_TARGET: "17.0"
        INFOPLIST_FILE: HotstashShare/Resources/Info.plist
        DEVELOPMENT_TEAM: 4PMSUCCX7P
        CODE_SIGN_STYLE: Automatic
        SWIFT_STRICT_CONCURRENCY: minimal
        TARGETED_DEVICE_FAMILY: "1,2"
      configs:
        Debug:
          SWIFT_OPTIMIZATION_LEVEL: "-Onone"
          DEBUG_INFORMATION_FORMAT: dwarf
          ONLY_ACTIVE_ARCH: YES
        Release:
          SWIFT_OPTIMIZATION_LEVEL: "-O"
          DEBUG_INFORMATION_FORMAT: "dwarf-with-dsym"
          VALIDATE_PRODUCT: YES
          ONLY_ACTIVE_ARCH: NO

    entitlements:
      path: HotstashShare/Resources/HotstashShare.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.zeyadamer.hotstash

  HotstashControls:
    type: app-extension
    platform: iOS
    deploymentTarget: "18.0"

    sources:
      - path: HotstashControls
        excludes:
          - Resources/Info.plist
          - Resources/HotstashControls.entitlements

    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.zeyadamer.hotstash.controls
        PRODUCT_NAME: HotstashControls
        SWIFT_VERSION: "5.9"
        IPHONEOS_DEPLOYMENT_TARGET: "18.0"
        INFOPLIST_FILE: HotstashControls/Resources/Info.plist
        DEVELOPMENT_TEAM: 4PMSUCCX7P
        CODE_SIGN_STYLE: Automatic
        SWIFT_STRICT_CONCURRENCY: minimal
        TARGETED_DEVICE_FAMILY: "1,2"
      configs:
        Debug:
          SWIFT_OPTIMIZATION_LEVEL: "-Onone"
          DEBUG_INFORMATION_FORMAT: dwarf
          ONLY_ACTIVE_ARCH: YES
        Release:
          SWIFT_OPTIMIZATION_LEVEL: "-O"
          DEBUG_INFORMATION_FORMAT: "dwarf-with-dsym"
          VALIDATE_PRODUCT: YES
          ONLY_ACTIVE_ARCH: NO

    dependencies:
      - sdk: WidgetKit.framework
      - sdk: SwiftUI.framework

    entitlements:
      path: HotstashControls/Resources/HotstashControls.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.zeyadamer.hotstash

schemes:
  Hotstash:
    build:
      targets:
        Hotstash: all
        HotstashTests: [test]
    test:
      targets:
        - HotstashTests
    run:
      config: Debug
    archive:
      config: Release

  HotstashIOS:
    build:
      targets:
        HotstashIOS: all
    run:
      config: Debug
    archive:
      config: Release
